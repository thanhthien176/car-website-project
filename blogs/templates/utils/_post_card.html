<div class="col">
    <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative h-100">
        <div class="col p-4 d-flex flex-column position-static">
        <strong class="d-inline-block mb-2 text-primary-emphasis">
            {{ post.category }}
        </strong>
        <h3 class="mb-0">{{ post.title }}</h3>
        <div class="mb-1 text-body-secondary">
            {{ post.author.display_name }} · {{ post.published_at|date:"d/m/Y" }}
        </div>
        <p class="card-text mb-auto">
            This is a wider card with supporting text below as a natural lead-in to
            additional content.
        </p>
        <a
            href="{% url 'blogs:post_detail' slug=post.slug %}"
            class="icon-link gap-1 icon-link-hover stretched-link"
        >
            Continue reading
            <svg class="bi" aria-hidden="true">
            <use xlink:href="#chevron-right"></use>
            </svg>
        </a>
        </div>
        <div class="col-auto d-none d-lg-block" style="max-width:200px;">
            {% if post.sections.first.image %}
                <img src="{{ post.sections.first.image.url }}" 
                     alt="{{ post.title}}"
                     class="w-100 h-100 py-2"
                     style="object-fit:cover;">
            {% else %}
                <svg
                aria-label="Placeholder: Thumbnail"
                class="bd-placeholder-img"
                height="250"
                preserveAspectRatio="xMidYMid slice"
                role="img"
                width="200"
                xmlns="http://www.w3.org/2000/svg"
                >
                <title>Placeholder</title>
                <rect width="100%" height="100%" fill="#55595c"></rect>
                <text x="50%" y="50%" fill="#eceeef" dy=".3em">Thumbnail</text>
                </svg>
            {% endif %}

        </div>
    </div>
</div>
