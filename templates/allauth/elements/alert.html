{% load allauth %}
<div class="alert {% if tags and 'error' in tags %}alert-danger{% elif tags and 'warning' in tags %}alert-warning{% elif tags and 'success' in tags %}alert-success{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
    {% slot %}{% endslot %}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
