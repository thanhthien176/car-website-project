{% load i18n %}
<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #212529;">
    <div style="max-width: 480px; margin: auto; padding: 24px;">
        <h3>Đặt lại mật khẩu</h3>
        <p>Xin chào <strong>{{ user.email }}</strong>,</p>
        <p>Bạn (hoặc ai đó) vừa yêu cầu đặt lại mật khẩu cho tài khoản này tại Xehoi360.</p>
        <p style="text-align:center; margin: 24px 0;">
            <a href="{{ password_reset_url }}"
               style="background:#0d6efd; color:#fff; padding:10px 20px; text-decoration:none; border-radius:4px;">
                Đặt mật khẩu mới
            </a>
        </p>
        <p style="font-size: 13px; color: #6c757d;">
            Nếu bạn không yêu cầu điều này, hãy bỏ qua email — mật khẩu của bạn sẽ không thay đổi.
        </p>
    </div>
</body>
</html>
