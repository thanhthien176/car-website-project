<nav class="mt-4">
    <ul class="pagination justify-content-center">

        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" 
                href="?page={{ page_obj.previous_page_number }}&brand={{ current_brand }}&body={{current_body}}">
            &laquo;
            </a>
        </li>
        {% endif %}

        {% for num in paginator.page_range %}
        <li class="page-item {% if num == page_obj.number %}active{% endif %}">
            <a class="page-link" 
                href="?page={{ num }}&brand={{ current_brand }}&body={{ current_body }}">
                {{ num }}
            </a>
        </li>
        {% endfor %}

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link" 
                    href="?page={{ page_obj.next_page_number }}&brand={{ current_brand }}&body={{ current_body }}">
                    &raquo;
                </a>
            </li>
        {% endif %}
    </ul>
</nav>
