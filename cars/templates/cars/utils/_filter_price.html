<div 
    class="mb-3"
    x-data="{
        min: parseInt('{{ current_min_price|default:0 }}') || 0,
        max: parseInt('{{ current_max_price|default:5000 }}') || 5000,
        minLimit: 0,
        maxLimit: 5000,
        gap: 50,  // khoảng cách tối thiểu giữa 2 mốc, tránh min == max dính chặt

        onMinInput() {
            if (this.min > this.max - this.gap) {
                this.min = this.max - this.gap;
            }
        },
        onMaxInput() {
            if (this.max < this.min + this.gap) {
                this.max = this.min + this.gap;
            }
        },
        fire() {
            this.$nextTick(() => $dispatch('price-filter-changed'));
        }
    }"
>
    <label class="form-label fw-semibold small text-uppercase text-muted mb-2">
        Khoảng giá (triệu VNĐ)
    </label>

    {# Track + 2 overlapping range bars #}
    <div class="range-slider position-relative mb-3" style="height: 24px;">
        <input type="range"
            :min="minLimit" :max="maxLimit" step="10"
            x-model.number="min"
            @input="onMinInput()"
            @change="fire()"
            class="range-thumb range-thumb-min">

        <input type="range"
            :min="minLimit" :max="maxLimit" step="10"
            x-model.number="max"
            @input="onMaxInput()"
            @change="fire()"
            class="range-thumb range-thumb-max">

        {# Thanh track tô màu giữa 2 giá trị - tính % bằng inline style #}
        <div class="range-track-fill position-absolute top-50 translate-middle-y bg-primary rounded"
            style="height:4px; z-index:1;"
            :style="`left: ${(min - minLimit) / (maxLimit - minLimit) * 100}%;
                     right: ${100 - (max - minLimit) / (maxLimit - minLimit) * 100}%;`">
        </div>
    </div>

    <div class="row g-2">
        <div class="col-6">
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-light text-muted">Từ</span>
                <input type="number" name="min_price" x-model.number="min"
                    @change="onMinInput(); fire()" class="form-control">
            </div>
        </div>
        <div class="col-6">
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-light text-muted">Đến</span>
                <input type="number" name="max_price" x-model.number="max"
                    @change="onMaxInput(); fire()" class="form-control">
            </div>
        </div>
    </div>

    <div 
        hx-get="{% url 'cars:car_list' %}"
        hx-trigger="price-filter-changed from:body delay:300ms"
        hx-include="#filter-form"
        hx-target="#car-grid-container"
        hx-push-url="true"
        style="display: none;"
    ></div>
</div>
