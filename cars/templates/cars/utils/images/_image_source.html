<div x-data="{ show: false }">
    <button type="button"
            class="img-attribution-toggle rounded"
            @click="show = !show"
            aria-label="Thông tin bản quyền ảnh">
        <i class="bi bi-info-circle"></i>
    </button>
    <div class="img-attribution-overlay" x-show="show" x-transition x-cloak>
        {{ image.attribution_html|default:"CC0" }}
    </div>
    
</div>
