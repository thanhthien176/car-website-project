<div class="col">
    <a href="{{ brand.get_absolute_url }}" class="text-decoration-none">
        <div class="card text-center h-100 card-brand">
            <div class="card-body d-flex flex-column">
                {% if brand.logo %}
                    <img src="{{ brand.logo.url }}" alt="{{ brand.name }}"
                    class="brand-logo align-self-center mb-3">
                {% else %}
                    <i class="bi bi-shield-check fs-1 text-muted-custom"></i>
                {% endif %}
                <p class="mb-0 fw-semibold mt-auto mt-2">{{ brand.name }}</p>
                <small class="text-muted mb-1">{{ brand.country_of_origin }}</small>
            </div>
        </div>    
    </a>
</div>
