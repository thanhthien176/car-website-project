[project]
name = "projectcarweb"
version = "0.1.0"
description = "A Django-powered vehicle catalog platform with REST APIs, reviews, comparison tools, image processing, and automated testing."
authors = [
    {name = "thiennt176",email = "thanhthien176@gmail.com"}
]
package-mode = false

requires-python = ">=3.12"
dependencies = [
    "asgiref (==3.11.1)",
    "django (>=6.0.6,<7.0.0)",
    "django-stubs (==6.0.3)",
    "django-stubs-ext (==6.0.3)",
    "iniconfig (==2.3.0)",
    "packaging (==26.2)",
    "pillow (==12.1.1)",
    "pluggy (==1.6.0)",
    "psycopg2-binary (==2.9.11)",
    "pygments (==2.20.0)",
    "pytest (==9.0.3)",
    "python-decouple (==3.8)",
    "sqlparse (==0.5.5)",
    "types-pyyaml (==6.0.12.20260508)",
    "typing-extensions (==4.15.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "django-htmx (>=1.27.0,<2.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-filter (>=25.2,<26.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "boto3 (>=1.43.34,<2.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "django-allauth (>=65.18.0,<66.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "django-admin-honeypot-updated-2021 (>=1.2.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "bandit (>=1.9.4,<2.0.0)"
]
